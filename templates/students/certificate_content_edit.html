{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h1 class="h3 mb-4 text-gray-800">
        Edit Certificate
    </h1>

    <div class="card shadow mb-4">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                {{ form.certificate_content }}

                <br>

                <button type="submit" class="btn btn-primary">
                    Preview Certificate
                </button>

            </form>

        </div>
    </div>

</div>


<!-- TinyMCE MUST load first -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>


<!-- Only initialize after TinyMCE is loaded -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    if (typeof tinymce === "undefined") {
        console.error("TinyMCE failed to load.");
        return;
    }

    tinymce.init({
        selector: '#id_certificate_content',

        height: 650,

        menubar: true,

        plugins: [
            'lists',
            'link',
            'image',
            'table',
            'code'
        ],

        toolbar:
            'undo redo | ' +
            'fontfamily fontsize | ' +
            'bold italic underline | ' +
            'forecolor backcolor | ' +
            'alignleft aligncenter alignright alignjustify | ' +
            'bullist numlist | ' +
            'table image link | ' +
            'removeformat code',

        font_family_formats:
            'Arial=arial,helvetica,sans-serif;' +
            'Times New Roman=times new roman,times,serif;' +
            'Georgia=georgia,serif;' +
            'Verdana=verdana,geneva,sans-serif',

        content_style: `
            body {
                font-family: Arial, sans-serif;
                padding: 30px;
                max-width: 1050px;
                margin: auto;
            }

            img {
                max-width: 100%;
                height: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            table td,
            table th {
                border: 1px solid #444;
                padding: 6px;
            }
        `
    });

});
</script>

{% endblock %}
